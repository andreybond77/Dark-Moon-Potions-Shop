<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="no-referrer">
    
    <title>Dark Moon Potions - Интернет-магазин магических зелий</title>
    
    <!-- Предподключение для быстрой загрузки шрифтов -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Все готические шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=MedievalSharp&family=UnifrakturMaguntia&display=swap" 
          rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
          rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        /* Базовые сбросы и переменные */
        :root {
            --potion-purple: #9d4edd;
            --dark-purple: #1a0033;
            --moonlight: #c77dff;
            --blood-red: #6a040f;
            --dragon-green: #38b000;
            --phoenix-orange: #ff9e00;
            --crystal-blue: #4361ee;
            --shadow-black: #0a0a2a;
            --glass-bg: rgba(26, 0, 51, 0.7);
            --glass-border: rgba(157, 78, 221, 0.2);
            --text-primary: #e6e6ff;
            --text-secondary: #b8b8d8;
            --text-muted: #ffd700;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'MedievalSharp', 'Georgia', serif;
            background: linear-gradient(135deg, #0a2a3b 0%, #1a5a7a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }
        
        /* Базовые стили для заголовков */
        h1, h2, h3, h4, h5, h6,
        .section-title,
        .card-title,
        .navbar-brand {
            font-family: 'Cinzel Decorative', 'Georgia', serif !important;
            font-weight: 700 !important;
            letter-spacing: 1.5px !important;
        }
        
        /* Готические заголовки */
        .gothic-title,
        .gothic-majestic,
        .logo-text {
            font-family: 'UnifrakturMaguntia', cursive, serif !important;
            letter-spacing: 1.5px;
        }
        
        /* Текст */
        p, span, div, .card-description {
            font-family: 'MedievalSharp', 'Georgia', serif !important;
        }
        
        /* Кнопки */
        .btn, .nav-link, .badge, .alert {
            font-family: 'MedievalSharp', 'Georgia', serif !important;
        }
        
        body {
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Основной скрипт приложения (Vite сам подключает CSS через main.tsx) -->
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
